<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - WhatsApp Style</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        body {
            background: #0a0a0a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .phone-frame {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            max-height: 900px;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }

        .app-header {
            background: #1a1a1a;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a2a;
            flex-shrink: 0;
            min-height: 65px;
        }

        .app-header .title {
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-header .title i {
            color: #25d366;
        }

        .app-header .header-actions {
            display: flex;
            gap: 12px;
        }

        .app-header .header-actions button {
            background: transparent;
            border: none;
            color: #8898aa;
            font-size: 20px;
            cursor: pointer;
            transition: color 0.3s;
            padding: 4px;
        }

        .app-header .header-actions button:hover {
            color: #25d366;
        }

        .stats-bar {
            background: #121212;
            padding: 10px 16px;
            display: flex;
            justify-content: space-around;
            border-bottom: 1px solid #1a1a1a;
            flex-shrink: 0;
        }

        .stats-bar .stat-item {
            text-align: center;
        }

        .stats-bar .stat-item .num {
            color: #25d366;
            font-weight: 700;
            font-size: 16px;
        }

        .stats-bar .stat-item .label {
            color: #5a6a85;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .conversation-list {
            flex: 1;
            overflow-y: auto;
            background: #0a0a0a;
        }

        .conversation-list::-webkit-scrollbar {
            width: 4px;
        }

        .conversation-list::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 4px;
        }

        .conv-item {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid #141414;
            cursor: pointer;
            transition: background 0.2s;
            gap: 14px;
        }

        .conv-item:hover {
            background: #141414;
        }

        .conv-item .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #25d366, #128c7e);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 20px;
            flex-shrink: 0;
        }

        .conv-item .conv-info {
            flex: 1;
            min-width: 0;
        }

        .conv-item .conv-info .name {
            color: #fff;
            font-weight: 600;
            font-size: 15px;
        }

        .conv-item .conv-info .last-msg {
            color: #8898aa;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .conv-item .conv-meta {
            text-align: right;
            flex-shrink: 0;
        }

        .conv-item .conv-meta .time {
            color: #5a6a85;
            font-size: 11px;
        }

        .conv-item .conv-meta .badge {
            background: #25d366;
            color: white;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 50px;
            margin-top: 4px;
            display: inline-block;
        }

        .conv-item .conv-meta .delete-btn {
            background: transparent;
            border: none;
            color: #5a6a85;
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
            margin-top: 4px;
            transition: color 0.3s;
        }

        .conv-item .conv-meta .delete-btn:hover {
            color: #ff6b6b;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #5a6a85;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            color: #2a2a2a;
        }

        .empty-state h3 {
            color: #8898aa;
            font-weight: 500;
            font-size: 18px;
        }

        .empty-state p {
            font-size: 14px;
            margin-top: 6px;
        }

        .chat-view {
            display: none;
            flex-direction: column;
            height: 100%;
            background: #0a0a0a;
        }

        .chat-view.active {
            display: flex;
        }

        .chat-view .chat-header {
            background: #1a1a1a;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #2a2a2a;
            flex-shrink: 0;
            min-height: 60px;
        }

        .chat-view .chat-header .back-btn {
            background: transparent;
            border: none;
            color: #25d366;
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
        }

        .chat-view .chat-header .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #25d366, #128c7e);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 18px;
            flex-shrink: 0;
        }

        .chat-view .chat-header .info {
            flex: 1;
        }

        .chat-view .chat-header .info .name {
            color: #fff;
            font-weight: 600;
            font-size: 16px;
        }

        .chat-view .chat-header .info .status {
            color: #25d366;
            font-size: 12px;
        }

        .chat-view .chat-header .chat-actions {
            display: flex;
            gap: 8px;
        }

        .chat-view .chat-header .chat-actions button {
            background: transparent;
            border: none;
            color: #8898aa;
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            transition: color 0.3s;
        }

        .chat-view .chat-header .chat-actions button:hover {
            color: #ff6b6b;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: #0a0a0a;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 4px;
        }

        .chat-messages .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            word-wrap: break-word;
            animation: messageIn 0.3s ease;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chat-messages .message.long-press {
            transform: scale(0.98);
            opacity: 0.7;
        }

        .chat-messages .message.sent {
            align-self: flex-end;
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .chat-messages .message.received {
            align-self: flex-start;
            background: #1a1a1a;
            color: #e2e8f0;
            border-bottom-left-radius: 4px;
        }

        .chat-messages .message .msg-text {
            font-size: 15px;
            line-height: 1.4;
        }

        .chat-messages .message .msg-time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
            text-align: right;
        }

        .chat-messages .message .msg-image {
            max-width: 200px;
            max-height: 200px;
            border-radius: 8px;
            margin-bottom: 4px;
            cursor: pointer;
            object-fit: cover;
        }

        .chat-messages .date-divider {
            text-align: center;
            color: #5a6a85;
            font-size: 12px;
            padding: 8px 0;
            width: 100%;
        }

        .chat-messages .date-divider span {
            background: #1a1a1a;
            padding: 4px 16px;
            border-radius: 20px;
        }

        .chat-messages .empty-chat {
            text-align: center;
            color: #5a6a85;
            padding: 40px 20px;
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-input-area {
            background: #1a1a1a;
            padding: 8px 12px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            border-top: 1px solid #2a2a2a;
            flex-shrink: 0;
            min-height: 62px;
        }

        .chat-input-area .attach-btn {
            background: transparent;
            border: none;
            color: #8898aa;
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
            transition: color 0.3s;
            flex-shrink: 0;
            align-self: center;
        }

        .chat-input-area .attach-btn:hover {
            color: #25d366;
        }

        .chat-input-area .message-input {
            flex: 1;
            background: #2a2a2a;
            border: none;
            border-radius: 20px;
            padding: 10px 16px;
            color: #fff;
            font-size: 15px;
            outline: none;
            resize: none;
            max-height: 100px;
            line-height: 1.4;
            font-family: inherit;
        }

        .chat-input-area .message-input::placeholder {
            color: #5a6a85;
        }

        .chat-input-area .send-btn {
            background: linear-gradient(135deg, #25d366, #128c7e);
            border: none;
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
            align-self: center;
        }

        .chat-input-area .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
        }

        .chat-input-area .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .image-preview {
            display: none;
            padding: 8px 12px;
            background: #1a1a1a;
            border-top: 1px solid #2a2a2a;
            position: relative;
        }

        .image-preview.active {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .image-preview img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
        }

        .image-preview .remove-image {
            background: #ff6b6b;
            border: none;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-viewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
            cursor: pointer;
        }

        .image-viewer.active {
            display: flex;
        }

        .image-viewer img {
            max-width: 100%;
            max-height: 90%;
            border-radius: 8px;
            object-fit: contain;
            cursor: default;
        }

        .image-viewer .close-viewer {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: none;
            color: white;
            font-size: 30px;
            cursor: pointer;
            z-index: 10;
            padding: 10px;
        }

        .image-viewer .close-viewer:hover {
            color: #ff6b6b;
        }

        .typing-indicator {
            align-self: flex-start;
            background: #1a1a1a;
            padding: 10px 16px;
            border-radius: 12px;
            display: none;
            gap: 4px;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #8898aa;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        .delete-dialog {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }

        .delete-dialog.active {
            display: flex;
        }

        .delete-dialog .dialog-box {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 24px;
            max-width: 320px;
            width: 90%;
        }

        .delete-dialog .dialog-box h3 {
            color: #ff6b6b;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .delete-dialog .dialog-box p {
            color: #8898aa;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .delete-dialog .dialog-box .dialog-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .delete-dialog .dialog-box .dialog-actions button {
            padding: 10px 24px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .delete-dialog .dialog-box .dialog-actions .cancel {
            background: rgba(255, 255, 255, 0.05);
            color: #8898aa;
        }

        .delete-dialog .dialog-box .dialog-actions .cancel:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .delete-dialog .dialog-box .dialog-actions .confirm {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.3);
        }

        .delete-dialog .dialog-box .dialog-actions .confirm:hover {
            background: rgba(255, 107, 107, 0.3);
        }

        @media (max-width: 430px) {
            .phone-frame { max-height: 100vh; border-radius: 0; }
        }

        @media (min-width: 431px) {
            .phone-frame { border-radius: 20px; overflow: hidden; }
        }
        /* Remove only the blue flash */
* {
    -webkit-tap-highlight-color: transparent !important;
}

/* Link styling */
.msg-text a {
    color: #25d366;
    text-decoration: underline;
    word-break: break-all;
}

.message.sent .msg-text a {
    color: #ffffff;
    text-decoration: underline;
}

.message.received .msg-text a {
    color: #25d366;
    text-decoration: underline;
}

/* ====== CUSTOM CONFIRM DIALOG ====== */
.custom-confirm-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 99999;
    justify-content: center;
    align-items: center;
    animation: fadeInOverlay 0.3s ease;
}

.custom-confirm-overlay.active {
    display: flex;
}

.custom-confirm {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 16px;
    padding: 28px 24px 24px;
    max-width: 340px;
    width: 90%;
    animation: slideUp 0.3s ease;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
}

.custom-confirm .icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
}

.custom-confirm .icon.warning {
    background: rgba(255, 107, 107, 0.15);
    color: #ff6b6b;
}

.custom-confirm .icon.info {
    background: rgba(37, 211, 102, 0.15);
    color: #25d366;
}

.custom-confirm .icon.question {
    background: rgba(255, 165, 0, 0.15);
    color: #ffa500;
}

.custom-confirm h3 {
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 8px;
}

.custom-confirm p {
    color: #8898aa;
    font-size: 14px;
    text-align: center;
    line-height: 1.5;
    margin-bottom: 20px;
}

.custom-confirm .actions {
    display: flex;
    gap: 10px;
    justify-content: center;
}

.custom-confirm .actions button {
    flex: 1;
    padding: 12px 20px;
    border-radius: 10px;
    border: none;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s;
}

.custom-confirm .actions .cancel-btn {
    background: rgba(255, 255, 255, 0.06);
    color: #8898aa;
    border: 1px solid #2a2a2a;
}

.custom-confirm .actions .cancel-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    transform: translateY(-1px);
}

.custom-confirm .actions .confirm-btn {
    background: linear-gradient(135deg, #25d366, #128c7e);
    color: white;
}

.custom-confirm .actions .confirm-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(37, 211, 102, 0.3);
}

.custom-confirm .actions .confirm-btn.danger {
    background: linear-gradient(135deg, #ff6b6b, #e74c3c);
}

.custom-confirm .actions .confirm-btn.danger:hover {
    box-shadow: 0 6px 20px rgba(255, 107, 107, 0.3);
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes fadeInOverlay {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* ====== CHAT BACKGROUND IMAGE ====== */
.messages-container,
.chat-messages {
    background-image: url('https://i.postimg.cc/XYHmJ05c/Picsart-26-08-05-03-30-01-803.jpg') !important;
    background-size: cover !important;
    background-position: center !important;
    background-repeat: no-repeat !important;
    background-attachment: fixed !important;
}

/* Make messages readable on background */
.message.sent {
    background: linear-gradient(135deg, #25d366, #128c7e) !important;
    color: white !important;
}

.message.received {
    background: rgba(26, 26, 26, 0.85) !important;
    backdrop-filter: blur(4px) !important;
    -webkit-backdrop-filter: blur(4px) !important;
    color: #e2e8f0 !important;
}

/* Optional: slight overlay to make text more readable */
.messages-container::before,
.chat-messages::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.15);
    pointer-events: none;
    z-index: 0;
}

.messages-container .message,
.chat-messages .message {
    position: relative;
    z-index: 1;
}
    </style>
</head>
<body>

    <div class="phone-frame">
        <div id="conversationView" style="display:flex;flex-direction:column;height:100%;">
            <div class="app-header">
                <div class="title"><i class="fab fa-whatsapp"></i> Admin</div>
                <div class="header-actions">
                    <button onclick="loadConversations()" title="Refresh"><i class="fas fa-sync-alt"></i></button>
                </div>
            </div>

            <div class="stats-bar">
                <div class="stat-item">
                    <div class="num" id="totalUsers">0</div>
                    <div class="label">Users</div>
                </div>
                <div class="stat-item">
                    <div class="num" id="totalMessages">0</div>
                    <div class="label">Messages</div>
                </div>
                <div class="stat-item">
                    <div class="num" id="totalImages">0</div>
                    <div class="label">Images</div>
                </div>
            </div>

            <div class="conversation-list" id="conversationList">
                <div class="empty-state">
                    <i class="fas fa-comments"></i>
                    <h3>No conversations</h3>
                    <p>Users will appear here when they message you</p>
                </div>
            </div>
        </div>

        <div class="chat-view" id="chatView">
            <div class="chat-header">
                <button class="back-btn" onclick="closeChat()"><i class="fas fa-arrow-left"></i></button>
                <div class="avatar" id="chatAvatar">W</div>
                <div class="info">
                    <div class="name" id="chatUserName">User</div>
                    <div class="status" id="chatUserStatus">Online</div>
                </div>
                <div class="chat-actions">
                    <button onclick="deleteCurrentUser()" title="Delete User"><i class="fas fa-trash"></i></button>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="empty-chat">No messages yet</div>
            </div>

            <div class="typing-indicator" id="typingIndicator">
                <span></span><span></span><span></span>
            </div>

            <div class="image-preview" id="imagePreview">
                <img id="previewImage" src="" alt="Preview">
                <span style="color:#8898aa;font-size:13px;flex:1;" id="previewFileName">image.jpg</span>
                <button class="remove-image" onclick="removeImage()">✕</button>
            </div>

            <div class="chat-input-area">
                <button class="attach-btn" onclick="document.getElementById('fileInput').click()">📎</button>
                <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFileSelect(event)">
                <textarea class="message-input" id="messageInput" rows="1" placeholder="Type a message..." onkeydown="handleEnter(event)" oninput="autoResize(this)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendReply()">➤</button>
            </div>
        </div>
    </div>

    <!-- Image Viewer -->
    <div class="image-viewer" id="imageViewer">
        <button class="close-viewer" onclick="closeImageViewer()">✕</button>
        <img id="viewerImage" src="">
    </div>
    
    
    <!-- Custom Confirm Dialog -->
<div class="custom-confirm-overlay" id="customConfirm">
    <div class="custom-confirm">
        <div class="icon" id="confirmIcon">⚠️</div>
        <h3 id="confirmTitle">Are you sure?</h3>
        <p id="confirmMessage">This action cannot be undone.</p>
        <div class="actions">
            <button class="cancel-btn" onclick="closeCustomConfirm()">Cancel</button>
            <button class="confirm-btn" id="confirmActionBtn" onclick="executeCustomConfirm()">Confirm</button>
        </div>
    </div>
</div>
    
    <div class="delete-dialog" id="deleteDialog">
        <div class="dialog-box">
            <h3><i class="fas fa-exclamation-triangle"></i> Delete User</h3>
            <p id="deleteDialogMessage">Are you sure you want to delete this user? All messages will be permanently removed.</p>
            <div class="dialog-actions">
                <button class="cancel" onclick="closeDeleteDialog()">Cancel</button>
                <button class="confirm" onclick="confirmDeleteUser()">Delete</button>
            </div>
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAUm-NXPXO_qsu2PnSNTPsdsWARBG1YDa8",
            authDomain: "admin-assisant-wolftz.firebaseapp.com",
            databaseURL: "https://admin-assisant-wolftz-default-rtdb.firebaseio.com",
            projectId: "admin-assisant-wolftz",
            storageBucket: "admin-assisant-wolftz.firebasestorage.app",
            messagingSenderId: "555076040888",
            appId: "1:555076040888:web:bc051a17b3b4f7ccbd5c4d",
            measurementId: "G-CD5GY75WLT"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let conversations = {};
        let currentUserId = null;
        let selectedImage = null;
        let deleteTargetId = null;
        let messageListener = null;

        function loadConversations() {
            database.ref('users').once('value', function(snapshot) {
                const data = snapshot.val();
                conversations = data || {};
                renderConversationList(conversations);
                updateStats(conversations);
            });
        }

        function renderConversationList(users) {
            const list = document.getElementById('conversationList');
            const keys = Object.keys(users);

            if (keys.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-comments"></i>
                        <h3>No conversations</h3>
                        <p>Users will appear here when they message you</p>
                    </div>
                `;
                return;
            }

            let html = '';
            keys.forEach(function(userId) {
                const user = users[userId];
                if (!user.username) return;

                const notifs = user.notifications ? Object.values(user.notifications) : [];
                const lastMsg = notifs.length > 0 ? notifs[notifs.length - 1] : null;
                const unreadCount = notifs.filter(function(n) { return !n.read; }).length;
                const lastTime = lastMsg ? getTime(lastMsg.timestamp) : '';

                const displayName = user.username;
                const initial = displayName.charAt(0).toUpperCase();

                let lastMsgText = 'No messages';
                if (lastMsg) {
                    if (lastMsg.imageUrl) {
                        lastMsgText = '📷 Image';
                    } else if (lastMsg.adminMessage || lastMsg.message) {
                        lastMsgText = (lastMsg.adminMessage || lastMsg.message).substring(0, 30);
                        if (lastMsg.adminMessage && lastMsg.adminMessage !== lastMsg.message) {
                            lastMsgText = '👤 ' + lastMsgText;
                        }
                    }
                }

                html += `
                    <div class="conv-item" onclick="openChat('${userId}')">
                        <div class="avatar">${initial}</div>
                        <div class="conv-info">
                            <div class="name">${displayName}</div>
                            <div class="last-msg">${lastMsgText}</div>
                        </div>
                        <div class="conv-meta">
                            <div class="time">${lastTime}</div>
                            ${unreadCount > 0 ? '<div class="badge">' + unreadCount + '</div>' : ''}
                            <button class="delete-btn" onclick="event.stopPropagation();showDeleteDialog('${userId}')">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            list.innerHTML = html;
        }

        function updateStats(users) {
            let totalUsers = 0, totalMsgs = 0, images = 0;

            Object.values(users).forEach(function(u) {
                if (u.username) totalUsers++;
                if (u.notifications) {
                    const n = Object.values(u.notifications);
                    totalMsgs += n.length;
                    images += n.filter(function(x) { return x.imageUrl; }).length;
                }
            });

            document.getElementById('totalUsers').textContent = totalUsers;
            document.getElementById('totalMessages').textContent = totalMsgs;
            document.getElementById('totalImages').textContent = images;
        }

        function getTime(timestamp) {
            if (!timestamp) return '';
            try {
                const date = new Date(timestamp);
                if (!isNaN(date)) {
                    return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                }
                if (timestamp.includes(',')) {
                    return timestamp.split(', ').pop() || '';
                }
                return timestamp;
            } catch (e) {
                return '';
            }
        }

        function openChat(userId) {
            currentUserId = userId;
            const user = conversations[userId];
            if (!user) return;

            const displayName = user.username;
            document.getElementById('chatUserName').textContent = displayName;
            document.getElementById('chatAvatar').textContent = displayName.charAt(0).toUpperCase();

            document.getElementById('conversationView').style.display = 'none';
            document.getElementById('chatView').classList.add('active');

            loadChatMessages(userId);
            setupChatListener(userId);
            markAsRead(userId);
        }

        function closeChat() {
            document.getElementById('conversationView').style.display = 'flex';
            document.getElementById('chatView').classList.remove('active');
            if (messageListener && currentUserId) {
                database.ref('users/' + currentUserId + '/notifications').off();
                messageListener = null;
            }
            currentUserId = null;
        }

       function loadChatMessages(userId) {
    const container = document.getElementById('chatMessages');
    container.innerHTML = '<div style="text-align:center;color:#5a6a85;padding:20px;">Loading...</div>';

    database.ref('users/' + userId + '/notifications').once('value', function(snapshot) {
        const notifications = snapshot.val();
        container.innerHTML = '';

        if (!notifications) {
            container.innerHTML = '<div class="empty-chat">No messages yet</div>';
            return;
        }

        const messages = Object.entries(notifications);
        if (messages.length === 0) {
            container.innerHTML = '<div class="empty-chat">No messages yet</div>';
            return;
        }

        messages.sort(function(a, b) {
            const timeA = new Date(a[1].timestamp || 0);
            const timeB = new Date(b[1].timestamp || 0);
            return timeA - timeB;
        });

        let lastDate = '';
        messages.forEach(function([key, msg]) {
            const date = new Date(msg.timestamp || Date.now());
            const dateStr = date.toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            if (dateStr !== lastDate) {
                lastDate = dateStr;
                const divider = document.createElement('div');
                divider.className = 'date-divider';
                divider.innerHTML = '<span>' + dateStr + '</span>';
                container.appendChild(divider);
            }

            const isAdmin = msg.adminMessage !== undefined;
            
            const messageEl = document.createElement('div');
            messageEl.className = 'message ' + (isAdmin ? 'sent' : 'received');
            messageEl.dataset.msgKey = key;
            
            // Long press - only on text, not images or links
            messageEl.addEventListener('mousedown', function(e) {
                if (e.target.tagName !== 'IMG' && e.target.tagName !== 'A') {
                    handleAdminLongPress(e, key);
                }
            });
            messageEl.addEventListener('mouseup', cancelAdminLongPress);
            messageEl.addEventListener('mouseleave', cancelAdminLongPress);
            messageEl.addEventListener('touchstart', function(e) {
                if (e.target.tagName !== 'IMG' && e.target.tagName !== 'A') {
                    handleAdminLongPress(e, key);
                }
            }, { passive: false });
            messageEl.addEventListener('touchend', cancelAdminLongPress, { passive: false });
            messageEl.addEventListener('touchmove', cancelAdminLongPress, { passive: false });

            let content = '';
            
            if (msg.imageUrl) {
                content += '<img src="' + msg.imageUrl + '" class="msg-image" onclick="event.stopPropagation();viewImage(\'' + msg.imageUrl + '\')" onerror="this.style.display=\'none\'" alt="Image">';
            }
            
            const displayText = isAdmin ? msg.adminMessage : msg.message;
            if (displayText) {
                content += '<div class="msg-text">' + linkify(displayText) + '</div>';
            }
            
            content += '<div class="msg-time">' + date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }) + '</div>';
            
            messageEl.innerHTML = content;
            container.appendChild(messageEl);
        });

        scrollChatToBottom();
    });
}

        function setupChatListener(userId) {
            if (messageListener) {
                database.ref('users/' + userId + '/notifications').off();
            }

            messageListener = database.ref('users/' + userId + '/notifications');
            messageListener.on('child_added', function() {
                loadChatMessages(userId);
                loadConversations();
            });
        }

        function markAsRead(userId) {
            database.ref('users/' + userId + '/notifications').once('value', function(snapshot) {
                const notifs = snapshot.val();
                if (!notifs) return;
                Object.keys(notifs).forEach(function(key) {
                    if (!notifs[key].read) {
                        database.ref('users/' + userId + '/notifications/' + key + '/read').set(true);
                    }
                });
            });
        }

        // ========== SEND REPLY WITH IMGBB ==========
        async function sendReply() {
            if (!currentUserId) return;

            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text && !selectedImage) return;

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            sendBtn.innerHTML = '⏳';

            const messageData = {
                timestamp: new Date().toLocaleString(),
                read: true
            };

            if (text) {
                messageData.message = text;
                messageData.adminMessage = text;
            }

            if (selectedImage) {
                try {
                    const formData = new FormData();
                    formData.append('image', selectedImage);
                    
                    const IMGBB_API_KEY = '5e227c108107599d3c5c45e12eb22bdb';
                    
                    const response = await fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_API_KEY, {
                        method: 'POST',
                        body: formData
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        messageData.imageUrl = data.data.url;
                        await database.ref('users/' + currentUserId + '/notifications').push(messageData);
                        
                        input.value = '';
                        input.style.height = 'auto';
                        removeImage();
                        sendBtn.disabled = false;
                        sendBtn.innerHTML = '➤';
                        loadChatMessages(currentUserId);
                        loadConversations();
                        scrollChatToBottom();
                    } else {
                        throw new Error(data.error?.message || 'Upload failed');
                    }
                } catch (error) {
                    console.error('Upload error:', error);
                    alert('Error uploading image: ' + error.message);
                    sendBtn.disabled = false;
                    sendBtn.innerHTML = '➤';
                }
            } else {
                try {
                    await database.ref('users/' + currentUserId + '/notifications').push(messageData);
                    input.value = '';
                    input.style.height = 'auto';
                    removeImage();
                    sendBtn.disabled = false;
                    sendBtn.innerHTML = '➤';
                    loadChatMessages(currentUserId);
                    loadConversations();
                    scrollChatToBottom();
                } catch (error) {
                    console.error('Database error:', error);
                    alert('Error sending message: ' + error.message);
                    sendBtn.disabled = false;
                    sendBtn.innerHTML = '➤';
                }
            }
        }

        function showDeleteDialog(userId) {
            deleteTargetId = userId;
            const user = conversations[userId];
            const name = user?.username || 'this user';
            document.getElementById('deleteDialogMessage').textContent = 'Delete "' + name + '" permanently? All messages will be removed.';
            document.getElementById('deleteDialog').classList.add('active');
        }

        function closeDeleteDialog() {
            document.getElementById('deleteDialog').classList.remove('active');
            deleteTargetId = null;
        }

       function confirmDeleteUser() {
    if (!deleteTargetId) return;
    
    const user = conversations[deleteTargetId];
    const name = user?.username || 'this user';
    
    showCustomConfirm(
        'Delete User?',
        'Delete "' + name + '" permanently? All messages will be removed.',
        function() {
            database.ref('users/' + deleteTargetId).remove()
                .then(function() {
                    closeDeleteDialog();
                    if (currentUserId === deleteTargetId) {
                        closeChat();
                    }
                    loadConversations();
                })
                .catch(function(err) {
                    showCustomConfirm('Error', 'Failed to delete: ' + err.message, null, false, '❌');
                });
        },
        true,
        '🗑️'
    );
}

        function deleteCurrentUser() {
            if (currentUserId) {
                showDeleteDialog(currentUserId);
            }
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            if (!file.type.startsWith('image/')) {
                alert('Please select an image file');
                event.target.value = '';
                return;
            }
            
            if (file.size > 10 * 1024 * 1024) {
                alert('Image must be less than 10MB');
                event.target.value = '';
                return;
            }
            
            selectedImage = file;
            const preview = document.getElementById('imagePreview');
            const previewImg = document.getElementById('previewImage');
            const previewName = document.getElementById('previewFileName');

            const reader = new FileReader();
            reader.onload = function(e) {
                previewImg.src = e.target.result;
                previewName.textContent = file.name;
                preview.classList.add('active');
            };
            reader.onerror = function() {
                alert('Error reading image file');
                selectedImage = null;
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function removeImage() {
            selectedImage = null;
            document.getElementById('imagePreview').classList.remove('active');
            document.getElementById('previewImage').src = '';
            document.getElementById('previewFileName').textContent = 'image.jpg';
        }

        // ========== IMAGE VIEWER ==========
        function viewImage(url) {
            if (!url) return;
            const viewer = document.getElementById('imageViewer');
            const viewerImg = document.getElementById('viewerImage');
            viewerImg.src = url;
            viewer.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeImageViewer() {
            const viewer = document.getElementById('imageViewer');
            viewer.style.display = 'none';
            document.getElementById('viewerImage').src = '';
            document.body.style.overflow = '';
        }
        
        // ========== CONVERT TEXT TO LINK ==========
function linkify(text) {
    if (!text) return '';
    
    // URL regex - matches http, https, and www links
    const urlRegex = /(https?:\/\/[^\s]+)|(www\.[^\s]+)/gi;
    
    return text.replace(urlRegex, function(url) {
        let href = url;
        // Add https:// if missing for www links
        if (!/^https?:\/\//i.test(url)) {
            href = 'https://' + url;
        }
        return '<a href="' + href + '" target="_blank" rel="noopener noreferrer" style="color: #bf00ff; text-decoration: underline; word-break: break-all;">' + url + '</a>';
    });
}

        function scrollChatToBottom() {
            const container = document.getElementById('chatMessages');
            setTimeout(function() {
                container.scrollTop = container.scrollHeight;
            }, 100);
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 100) + 'px';
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendReply();
            }
        }

        let adminLongPressTimer = null;

        function handleAdminLongPress(e, msgKey) {
            e.preventDefault();
            
            if (adminLongPressTimer) {
                clearTimeout(adminLongPressTimer);
                adminLongPressTimer = null;
            }
            
            adminLongPressTimer = setTimeout(function() {
                confirmAdminDeleteMessage(msgKey);
            }, 600);
        }

        function cancelAdminLongPress() {
            if (adminLongPressTimer) {
                clearTimeout(adminLongPressTimer);
                adminLongPressTimer = null;
            }
        }

 function confirmAdminDeleteMessage(msgKey) {
    if (!currentUserId || !msgKey) {
        console.error('Missing userId or message key');
        showCustomConfirm('Error', 'Cannot delete: missing user or message', null, false, '❌');
        return;
    }
    
    showCustomConfirm(
        'Delete Message?',
        'This message will be permanently removed.',
        function() {
            const path = 'users/' + currentUserId + '/notifications/' + msgKey;
            console.log('Admin deleting message:', msgKey);
            
            database.ref(path).remove()
                .then(function() {
                    console.log('Message deleted successfully');
                    loadChatMessages(currentUserId);
                    loadConversations();
                })
                .catch(function(error) {
                    console.error('Delete error:', error);
                    showCustomConfirm('Error', 'Failed to delete: ' + error.message, null, false, '❌');
                });
        },
        true,
        '🗑️'
    );
}

        database.ref('users').on('child_added', loadConversations);
        database.ref('users').on('child_changed', loadConversations);
        database.ref('users').on('child_removed', loadConversations);

        loadConversations();

        console.log('📱 WhatsApp-style Admin Panel with usernames loaded');
        
        // ========== CUSTOM CONFIRM DIALOG ==========
let confirmCallback = null;

function showCustomConfirm(title, message, onConfirm, isDanger = false, icon = '⚠️') {
    const overlay = document.getElementById('customConfirm');
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmMessage').textContent = message;
    document.getElementById('confirmIcon').textContent = icon;
    
    const confirmBtn = document.getElementById('confirmActionBtn');
    confirmBtn.className = 'confirm-btn' + (isDanger ? ' danger' : '');
    confirmBtn.textContent = isDanger ? 'Delete' : 'Confirm';
    
    // Store callback
    confirmCallback = onConfirm;
    
    overlay.classList.add('active');
}

function closeCustomConfirm() {
    document.getElementById('customConfirm').classList.remove('active');
    confirmCallback = null;
}

function executeCustomConfirm() {
    if (confirmCallback) {
        confirmCallback();
    }
    closeCustomConfirm();
}

// Close on overlay click (background)
document.addEventListener('click', function(e) {
    const overlay = document.getElementById('customConfirm');
    if (e.target === overlay) {
        closeCustomConfirm();
    }
});
    </script>
